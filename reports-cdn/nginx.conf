proxy_cache_path /var/cache/nginx/reports
    levels=1:2
    keys_zone=reports_cache:50m
    max_size=2g
    inactive=7d
    use_temp_path=off;

server {
    listen 80;
    server_name _;

    # Signature validation is performed on every request, including cache hits.
    # The CDN signature is excluded from the cache key, so the same immutable
    # object is stored only once in the Nginx cache.
    location = /_cdn_auth {
        internal;
        proxy_pass http://bionicpro-reports:8082/internal/cdn-auth?path=$cdn_path&expires=$cdn_expires&signature=$cdn_signature;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location ^~ /reports/ {
        set $cdn_path $uri;
        set $cdn_expires $arg_expires;
        set $cdn_signature $arg_signature;

        auth_request /_cdn_auth;

        proxy_pass http://bionicpro-reports:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache reports_cache;
        proxy_cache_key "$scheme$proxy_host$uri";
        proxy_cache_valid 200 7d;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 10s;
        proxy_cache_revalidate on;
        proxy_cache_background_update on;

        proxy_hide_header Set-Cookie;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    location / {
        return 404;
    }
}
