version: '3.8'

services:
  keycloak_db:
    image: postgres:14
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - ./postgres-keycloak-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
  keycloak:
#    image: quay.io/keycloak/keycloak:21.1
    image: playaru/keycloak-russian:26.5.0.1
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
    command: 
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    depends_on:
      - keycloak_db
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
  bionicpro-auth:
    build:
      context: ./bionicpro-auth
      dockerfile: Dockerfile
    env_file:
      - ./bionicpro-auth/.env
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: postgres://postgres:postgres@bionicpro-auth-db:5432/postgres?sslmode=disable
    depends_on:
      bionicpro-auth-db:
        condition: service_healthy

  bionicpro-auth-db:
    image: postgres:16-alpine
    container_name: bionicpro-auth-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./bionicpro-auth/init.sql:/docker-entrypoint-initdb.d/init.sql
      - bionicpro_auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'pg_isready -U postgres -d postgres'"]
      interval: 10s
      timeout: 3s
      retries: 3

  openldap:
    image: osixia/openldap:1.5.0
    container_name: openldap
    restart: unless-stopped

    environment:
      LDAP_ORGANISATION: "BionicPro"
      LDAP_DOMAIN: "example.com"
      LDAP_ADMIN_PASSWORD: "admin"
      LDAP_CONFIG_PASSWORD: "config"
      LDAP_TLS: "false"

    ports:
      - "389:389"
      - "636:636"

    volumes:
      - ./ldap/data/ldap:/var/lib/ldap
      - ./ldap/data/slapd:/etc/ldap/slapd.d
      - ./ldap/config.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/config.ldif:ro

    command: --copy-service

  crm-oracle:
    image: gvenzl/oracle-xe:21-slim
    container_name: crm-oracle
    ports:
      - "127.0.0.1:1521:1521"
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: CRM
      APP_USER_PASSWORD: crm
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./crm-db/:/container-entrypoint-initdb.d:ro
    restart: unless-stopped

  data-postgres:
    image: postgres:16
    container_name: data-postgres
    ports:
      - "127.0.0.1:5431:5432"
    environment:
      POSTGRES_DB: data_db
      POSTGRES_USER: data_user
      POSTGRES_PASSWORD: data
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./data-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U data_user -d data_db"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  olap-db:
    image: postgres:16-alpine
    container_name: olap-db
    environment:
      POSTGRES_DB: olap
      POSTGRES_USER: olap
      POSTGRES_PASSWORD: olap_dev
    ports:
      - "5434:5432"
    volumes:
      - olap_data:/var/lib/postgresql/data
      - ./olap-db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olap -d olap"]
      interval: 5s
      timeout: 3s
      retries: 10

  airflow:
    build:
      context: airflow
      dockerfile: Dockerfile
    container_name: airflow-standalone
    command: standalone
    ports:
      - "8181:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW_CONN_SOURCE_ORACLE: "oracle://CRM:crm@crm-oracle:1521/?service_name=XEPDB1"
      AIRFLOW_CONN_SOURCE_TELEMETRY: "postgresql://data_user:data@data-postgres:5432/data_db"
      AIRFLOW_CONN_OLAP_POSTGRES: "postgresql://olap:olap_dev@olap-db:5432/olap"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
    volumes:
      - airflow-data:/opt/airflow
      - ./airflow/dags:/opt/airflow/dags:ro
    restart: unless-stopped

volumes:
  airflow-data:
  olap_data:
  oracle-data:
  postgres-data:
  bionicpro_auth_data:
